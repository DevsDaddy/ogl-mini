[project]
name = "ogl-mini"
version = "1.1.0"
description = "Full featured hybrid security model for AI Agents security: Input / Output Guard + PII Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "onnxruntime>=1.18",
  "scikit-learn>=1.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "onnx>=1.16", "skl2onnx>=1.17"]
training = ["transformers>=4.41", "torch>=2.3", "onnx>=1.16", "optimum[onnxruntime]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
